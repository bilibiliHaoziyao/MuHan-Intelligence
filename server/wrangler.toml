#:schema
name = "muhan-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# 自定义域名：域名需已托管在 Cloudflare，
# 部署时自动创建 DNS 记录并签发证书。
routes = [
  { pattern = "api.novasync.cn", custom_domain = true }
]

[observability]
enabled = true

# D1 数据库（已创建：muhan-db）
[[d1_databases]]
binding = "DB"
database_name = "muhan-db"
database_id = "5ab18bd7-9002-48aa-999c-f7a2c0d5bf82"
