# Container-based CI images often cap the whole build at a few GB.
# Keep the Gradle daemon modest and let Kotlin run in-process, otherwise the
# Kotlin compiler daemon plus dex workers can trip the container memory limit.
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.daemon=false

kotlin.compiler.execution.strategy=in-process
kotlin.incremental=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
