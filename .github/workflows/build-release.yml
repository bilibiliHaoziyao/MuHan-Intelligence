name: Build Release APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      create_release:
        description: '创建 GitHub Release'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建签名 APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 赋予执行权限
        run: chmod +x ./gradlew

      # ------------------------------------------------------------------
      # 从仓库内提交的 keystore 还原发布签名配置。
      # 注意：密钥库与口令按要求一同提交到仓库，这并不安全，
      # 仅适用于个人测试分发场景。生产项目请改用 GitHub Secrets。
      #
      # storeFile 是相对于 `:app` 模块目录解析的，因此仓库根目录下的
      # keystore 必须写成 `../keystore/muhan-release.jks`。
      # ------------------------------------------------------------------
      - name: 准备发布签名
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -n "${KEYSTORE_B64:-}" ]; then
            echo "使用 Secrets 中的密钥库"
            echo "$KEYSTORE_B64" | base64 -d > app/keystore-release.jks
            printf 'storeFile=keystore-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
          elif [ -f keystore/muhan-release.jks ]; then
            echo "使用仓库内提交的密钥库"
            printf 'storeFile=../keystore/muhan-release.jks\nstorePassword=MuHan2026Release\nkeyAlias=muhan\nkeyPassword=MuHan2026Release\n' > keystore.properties
          else
            echo "::error::未找到可用的签名密钥库"
            exit 1
          fi

          echo "--- keystore.properties ---"
          sed 's/Password=.*/Password=***/' keystore.properties
          chmod 600 keystore.properties

      - name: 校验签名配置可解析
        run: |
          set -euo pipefail
          test -f "$(cd app && realpath "$(grep -oP '^storeFile=\K.*' ../keystore.properties)")" \
            || { echo "::error::签名文件路径无法解析"; exit 1; }
          echo "签名文件路径解析正常"

      - name: 运行单元测试
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: 构建 Release APK
        run: ./gradlew assembleRelease --stacktrace

      # 0.2.0 Fix2：不再构建/发布 Debug APK

      - name: 校验签名
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          echo "校验: $APK"
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --print-certs --verbose "$APK"

      - name: 整理产物
        id: artifacts
        run: |
          set -euo pipefail
          mkdir -p dist

          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts | head -n 1)
          VERSION_CODE=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts | head -n 1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          SAFE_VERSION=$(echo "$VERSION" | tr -d '[:space:]')
          RELEASE_APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)

          cp "$RELEASE_APK" "dist/MuHan-Intelligence-${SAFE_VERSION}-release.apk"

          # 生成校验值，方便用户核对下载完整性
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)

          ls -lh dist/
          echo "--- SHA256 ---"
          cat dist/SHA256SUMS.txt

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: MuHan-Intelligence-APK-${{ steps.artifacts.outputs.version }}
          path: dist/*
          retention-days: 30

      # ------------------------------------------------------------------
      # 标签推送时自动创建 Release 并附带 APK
      # ------------------------------------------------------------------
      - name: 创建 Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.create_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.artifacts.outputs.version) }}
          name: 慕寒智能 ${{ steps.artifacts.outputs.version }}
          draft: false
          prerelease: ${{ contains(steps.artifacts.outputs.version, 'dev') || contains(steps.artifacts.outputs.version, 'beta') || contains(steps.artifacts.outputs.version, 'alpha') }}
          generate_release_notes: true
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt

      - name: 构建摘要
        if: always()
        run: |
          {
            echo "## 慕寒智能构建结果"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 版本 | ${{ steps.artifacts.outputs.version }} |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| 触发方式 | ${{ github.event_name }} |"
          } >> "$GITHUB_STEP_SUMMARY"
